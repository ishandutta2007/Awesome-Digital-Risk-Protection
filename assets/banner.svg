<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Grid Pattern (Background Detail) -->
  <g opacity="0.1">
    <path d="M0,50 H1200 M0,100 H1200 M0,150 H1200 M0,200 H1200 M0,250 H1200 M0,300 H1200 M0,350 H1200" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4" />
    <path d="M100,0 V400 M200,0 V400 M300,0 V400 M400,0 V400 M500,0 V400 M600,0 V400 M700,0 V400 M800,0 V400 M900,0 V400 M1000,0 V400 M1100,0 V400" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Dynamic / Animated-Style Floating Background Elements (Positioned away from main text) -->
  <g opacity="0.25">
    <!-- Top-Right Radar Lines -->
    <circle cx="1050" cy="100" r="80" stroke="#3b82f6" stroke-width="1.5" fill="none" />
    <circle cx="1050" cy="100" r="140" stroke="#2563eb" stroke-width="1" stroke-dasharray="6 6" fill="none" />
    <circle cx="1050" cy="100" r="200" stroke="#1d4ed8" stroke-width="0.5" fill="none" />
    <line x1="1050" y1="100" x2="1170" y2="40" stroke="#60a5fa" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 1050 100" to="360 1050 100" dur="12s" repeatCount="indefinite" />
    </line>

    <!-- Bottom-Left Shield Watermark -->
    <path d="M 120 280 L 190 310 L 260 280 V 340 Q 190 400 190 400 Q 190 400 120 340 Z" stroke="#3b82f6" stroke-width="2" fill="url(#accentGrad)" />

    <!-- Pulse nodes in background corners -->
    <circle cx="950" cy="320" r="6" fill="#60a5fa">
      <animate attributeName="r" values="4;9;4" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="150" cy="80" r="5" fill="#3b82f6">
      <animate attributeName="r" values="3;7;3" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- FOREGROUND CONTENT (Protected from background overlap) -->
  <g text-anchor="middle" transform="translate(600, 0)">
    <!-- Security Shield Icon Badge -->
    <g transform="translate(0, 75)">
      <circle cx="0" cy="0" r="36" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5" filter="url(#glow)" />
      <path d="M-12 -10 L0 -16 L12 -10 V6 Q0 18 0 18 Q0 18 -12 6 Z" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M-4 0 L-1 3 L5 -3" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Title -->
    <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="0.5">
      Awesome Digital Risk Protection
    </text>

    <!-- Subtitle -->
    <text x="0" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated SaaS Platforms, OSINT Tools &amp; Threat Intelligence Ecosystem
    </text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 275)">
      <!-- Pill 1 -->
      <g transform="translate(-240, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <text x="0" y="5" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">🛡️ Brand Protection</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-80, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <text x="0" y="5" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">🌐 Dark Web</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(70, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <text x="0" y="5" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">🔍 OSINT Recon</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(235, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <text x="0" y="5" font-family="sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">⚡ Threat Intel</text>
      </g>
    </g>

    <!-- Footer tag -->
    <text x="0" y="345" font-family="sans-serif" font-size="13" font-weight="500" fill="#64748b" letter-spacing="1">
      OCTOBER 2026 EDITION • OPEN SOURCE &amp; ENTERPRISE ECOSYSTEM
    </text>
  </g>
</svg>
